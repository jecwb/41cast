</a></div>

</div>

<script>
function abrirYouTube(e){
  e.preventDefault();

  const appLink = "youtube://www.youtube.com/@41Cast";
  const webLink = "https://www.youtube.com/@41Cast";

  const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

  if(isMobile){
    window.location.href = appLink;

    setTimeout(function(){
      window.location.href = webLink;
    }, 1200);
  } else {
    window.open(webLink, "_blank");
  }
}
</script>
